<!DOCTYPE html>
<html>

<head>

    <title>
        Health Prediction App
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="container mt-5">

    <h2 class="mb-4">
        Patient Records
    </h2>

    <a
        href="/add"
        class="btn btn-primary mb-3"
    >
        Add Patient
    </a>

    <table class="table table-bordered">

        <tr>

            <th>Name</th>

            <th>Email</th>

            <th>Glucose</th>

            <th>Haemoglobin</th>

            <th>Cholesterol</th>

            <th width="35%">
                Remarks
            </th>

            <th>Actions</th>

        </tr>

        {% for patient in patients %}

        <tr>

            <td>
                {{ patient.full_name }}
            </td>

            <td>
                {{ patient.email }}
            </td>

            <td>
                {{ patient.glucose }}
            </td>

            <td>
                {{ patient.haemoglobin }}
            </td>

            <td>
                {{ patient.cholesterol }}
            </td>

            <td>

                <textarea
                    class="form-control"
                    rows="8"
                    readonly
                >{{ patient.remarks }}</textarea>

            </td>

            <td>

                <a
                    href="/edit/{{ patient.id }}"
                    class="btn btn-warning btn-sm"
                >
                    Edit
                </a>

                <a
                    href="/delete/{{ patient.id }}"
                    class="btn btn-danger btn-sm"
                >
                    Delete
                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

</body>

</html>
